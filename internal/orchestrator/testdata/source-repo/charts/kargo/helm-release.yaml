---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kargo
  namespace: kargo
spec:
  type: oci
  interval: 168h
  url: oci://ghcr.io/akuity/kargo-charts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kargo
  namespace: kargo
spec:
  chart:
    spec:
      chart: kargo
      version: '1.9.6'
      sourceRef:
        kind: HelmRepository
        name: kargo
  interval: 168h
  timeout: 10m
